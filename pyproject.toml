[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shea"
version = "0.1.0"
description = "SHEA — user-sovereign, modular AI agent runtime (Phase 1-8: core hardening)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "cryptography>=42.0",
    "keyring>=24.0.0",
    "fastapi",
    "uvicorn",
    "pywebview",
    "click",
    "sse-starlette",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
]
browser = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B"]
[project.scripts]
shea = "shea.__main__:main"