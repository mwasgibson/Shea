<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHEA · Observability</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <h1>SHEA</h1>
            <p>Audit · metrics</p>
          </div>
          <span id="status-indicator" class="status online">Live</span>
        </div>
        <div class="sidebar-section">
          <h3>Navigate</h3>
          <ul class="nav-list">
            <li><a href="index.html">Chat</a></li>
            <li><a class="active" href="dashboard.html">Observability</a></li>
          </ul>
        </div>
      </aside>

      <main id="dashboard-container">
        <div class="metrics-grid">
          <div class="metric-card">
            <h3>Total intents</h3>
            <div class="value" id="val-intents">0</div>
          </div>
          <div class="metric-card">
            <h3>Tools executed</h3>
            <div class="value" id="val-tools">0</div>
          </div>
          <div class="metric-card">
            <h3>Success rate</h3>
            <div class="value" id="val-success-rate">0%</div>
          </div>
          <div class="metric-card">
            <h3>Avg duration</h3>
            <div class="value" id="val-avg-time">0 ms</div>
          </div>
        </div>

        <div class="charts-row">
          <div class="chart-container">
            <canvas id="successRateChart"></canvas>
          </div>
          <div class="chart-container">
            <canvas id="executionTimeChart"></canvas>
          </div>
        </div>

        <div class="audit-table-container">
          <h3>Audit chain</h3>
          <table>
            <thead>
              <tr>
                <th>Seq</th>
                <th>Time</th>
                <th>Component</th>
                <th>Action</th>
                <th>Result</th>
                <th>Task</th>
              </tr>
            </thead>
            <tbody id="audit-table-body"></tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="dashboard.js"></script>
  </body>
</html>
